name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artefakt: PseudonyMed-macOS
          - os: windows-latest
            artefakt: PseudonyMed-Windows
          - os: ubuntu-latest
            artefakt: PseudonyMed-Linux
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4
          libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libfontconfig1
      - run: uv sync --extra ocr --extra codes --extra gui --extra pgp --extra carddav --group build
      - run: uv run --group build python packaging/build.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Pack (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent PseudonyMed.app ${{ matrix.artefakt }}.zip
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/PseudonyMed -DestinationPath dist/${{ matrix.artefakt }}.zip
      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: cd dist && tar czf ${{ matrix.artefakt }}.tar.gz PseudonyMed
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefakt }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
